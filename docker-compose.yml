version: "3.8"

services:
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - NODE_ENV=development
    networks:
      - healthcare-network

  patient-service:
    build: ./services/patient-service
    container_name: patient-service
    ports:
      - "5001:5001"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - PORT=5001
    networks:
      - healthcare-network

  doctor-service:
    build: ./services/doctor-service
    container_name: doctor-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=development
    networks:
      - healthcare-network

  appointment-service:
    build: ./services/appointment-service
    container_name: appointment-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - PATIENT_SERVICE_URL=http://patient-service:5001
      - DOCTOR_SERVICE_URL=http://doctor-service:3002
      - BILLING_SERVICE_URL=http://billing-service:5002
      - AUTH_SERVICE_URL=http://auth-service:3001
      - NODE_ENV=development
    depends_on:
      - patient-service
      - doctor-service
      - billing-service
      - auth-service
    networks:
      - healthcare-network

  billing-service:
    build: ./services/billing-service
    container_name: billing-service
    ports:
      - "5002:5002"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - PORT=5002
    networks:
      - healthcare-network

networks:
  healthcare-network:
    driver: bridge
